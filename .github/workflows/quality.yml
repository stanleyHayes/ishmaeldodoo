name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-history:
    name: Repository history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    name: Select affected deployment artifacts
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve affected applications
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'render.yaml'
              - 'packages/contracts/**'
              - 'apps/api/Dockerfile'
              - '.dockerignore'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/quality.yml'
            web:
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'apps/web/Dockerfile'
              - '.dockerignore'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/quality.yml'
            admin:
              - 'apps/admin/**'
              - 'packages/contracts/**'
              - 'apps/admin/Dockerfile'
              - '.dockerignore'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/quality.yml'

  workspace:
    name: Contracts, boundaries, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_ENV: test
      NEXT_PUBLIC_API_BASE_URL: https://api.example.test/v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y --no-install-recommends poppler-utils
          chrome_path=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          printf 'CHROME_EXECUTABLE_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run workspace quality gate
        run: npm run check

      - name: Run production Lighthouse budgets
        run: npm run test:lighthouse

      - name: Retain Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Retain coverage summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summaries
          path: apps/*/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Run public and protected-admin browser journeys
        run: npm run test:e2e

      - name: Retain Playwright failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
          retention-days: 14

      - name: Start ephemeral MongoDB replica set
        run: docker compose -f infra/docker-compose.test.yml up -d --wait

      - name: Run real MongoDB integration tests
        env:
          MONGODB_TEST_URI: mongodb://amanor_test_admin:amanor_test_admin_password@127.0.0.1:27028
        run: npm run test:integration --workspace @amanor/api

      - name: Stop ephemeral MongoDB replica set
        if: always()
        run: docker compose -f infra/docker-compose.test.yml down --volumes

      - name: Prove logical backup and isolated restore
        run: npm run test:backup-restore

  api-image:
    name: API image, SBOM and vulnerability gate
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build production API image
        run: docker build -f apps/api/Dockerfile -t amanor-api:ci .

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: amanor-api:ci
          format: spdx-json
          output-file: amanor-api.spdx.json

      - name: Fail on fixable high or critical vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: amanor-api:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
          output-file: amanor-api.sarif

      - name: Upload API findings to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: amanor-api.sarif
          category: amanor-api-container

      - name: Retain API supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-image-supply-chain
          path: |
            amanor-api.spdx.json
            amanor-api.sarif
          if-no-files-found: error
          retention-days: 90

  web-image:
    name: Public-web image, runtime and supply-chain gates
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and exercise public-web image
        run: npm run test:frontend-containers -- web

      - name: Generate public-web SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: amanor-web:verification
          format: spdx-json
          output-file: amanor-web.spdx.json

      - name: Scan public-web image
        uses: anchore/scan-action@v7
        with:
          image: amanor-web:verification
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
          output-file: amanor-web.sarif

      - name: Upload public-web findings to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: amanor-web.sarif
          category: amanor-web-container

      - name: Retain public-web supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-web-image-supply-chain
          path: |
            amanor-web.spdx.json
            amanor-web.sarif
          if-no-files-found: error
          retention-days: 90

  admin-image:
    name: Admin/CMS image, runtime and supply-chain gates
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and exercise Admin/CMS image
        run: npm run test:frontend-containers -- admin

      - name: Generate Admin/CMS SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: amanor-admin:verification
          format: spdx-json
          output-file: amanor-admin.spdx.json

      - name: Scan Admin/CMS image
        uses: anchore/scan-action@v7
        with:
          image: amanor-admin:verification
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
          output-file: amanor-admin.sarif

      - name: Upload Admin/CMS findings to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: amanor-admin.sarif
          category: amanor-admin-container

      - name: Retain Admin/CMS supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-cms-image-supply-chain
          path: |
            amanor-admin.spdx.json
            amanor-admin.sarif
          if-no-files-found: error
          retention-days: 90
