name: Deploy separated applications

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment and provider namespace
        required: true
        type: choice
        options:
          - preview
          - staging
          - production
      revision:
        description: Exact reviewed 40-character commit SHA to deploy
        required: true
        type: string
      migration_evidence:
        description: HTTPS evidence URL for backup, migration and idempotent rerun
        required: true
        type: string
      migration_evidence_sha256:
        description: SHA-256 digest of the reviewed migration evidence artifact
        required: true
        type: string
      confirmation:
        description: Type DEPLOY to confirm provider mutation
        required: true
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy API, Admin and Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      GH_TOKEN: ${{ github.token }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_GITHUB_REPO_ID: ${{ vars.VERCEL_GITHUB_REPO_ID }}
      VERCEL_ADMIN_PROJECT: ${{ vars.VERCEL_ADMIN_PROJECT }}
      VERCEL_WEB_PROJECT: ${{ vars.VERCEL_WEB_PROJECT }}
      VERCEL_TARGET: ${{ vars.VERCEL_TARGET }}
      AMANOR_SMOKE_ENVIRONMENT: ${{ inputs.environment }}
      AMANOR_SMOKE_API_URL: ${{ vars.AMANOR_SMOKE_API_URL }}
      AMANOR_SMOKE_ADMIN_URL: ${{ vars.AMANOR_SMOKE_ADMIN_URL }}
      AMANOR_SMOKE_WEB_URL: ${{ vars.AMANOR_SMOKE_WEB_URL }}
      AMANOR_SMOKE_EDGE_AUTHORIZATION: ${{ secrets.AMANOR_SMOKE_EDGE_AUTHORIZATION }}
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Validate immutable candidate and environment custody
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          MIGRATION_EVIDENCE: ${{ inputs.migration_evidence }}
          MIGRATION_EVIDENCE_SHA256: ${{ inputs.migration_evidence_sha256 }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/validate-deployment-dispatch.mjs

      - name: Require successful hosted gates for exact revision
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          GH_REPOSITORY: ${{ github.repository }}
          AMANOR_HOSTED_GATES_EVIDENCE_PATH: deployment-evidence/hosted-gates.json
        run: node scripts/verify-hosted-gates.mjs

      - name: Deploy exact revision API then Admin then Web
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          AMANOR_DEPLOYMENT_EVIDENCE_PATH: deployment-evidence/provider-deployments.json
        run: node scripts/deploy-provider-revision.mjs

      - name: Verify three deployed origins
        env:
          AMANOR_SMOKE_EVIDENCE_PATH: deployment-evidence/smoke.json
        run: node scripts/wait-for-deployment-smoke.mjs

      - name: Bind deployment evidence manifest
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          AMANOR_SMOKE_ENVIRONMENT: ${{ inputs.environment }}
          AMANOR_DEPLOYMENT_EVIDENCE_DIR: deployment-evidence
          AMANOR_DEPLOYMENT_RUN_ID: ${{ github.run_id }}
          AMANOR_DEPLOYMENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          AMANOR_DEPLOYMENT_REPOSITORY: ${{ github.repository }}
          AMANOR_MIGRATION_EVIDENCE: ${{ inputs.migration_evidence }}
          AMANOR_MIGRATION_EVIDENCE_SHA256: ${{ inputs.migration_evidence_sha256 }}
        run: node scripts/bind-deployment-evidence.mjs

      - name: Retain immutable deployment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deployment-${{ inputs.environment }}-${{ inputs.revision }}
          path: deployment-evidence
          if-no-files-found: error
          retention-days: 90
